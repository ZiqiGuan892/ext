[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-omni-ext"
version = "0.1.0"
description = "Out-of-tree model adapters for verl-omni (three-layer: plugin / monkey-patch / gate-patch)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["verl-omni>=0.2.0"]

# ============================================================================
# 入口点自动发现 —— 消灭对上游 __init__.py 的编辑
#
# 每加一个模型/trainer/reward，只需在这里加一行声明，不需要改任何 __init__.py。
# verl_omni_ext/__init__.py 的 _load_all() 会遍历所有入口点组逐个 import，
# 触发 @register 装饰器注册到各注册表。
#
# 入口点组：
#   verl_omni.models   — 模型适配器（@OmniModelBase.register）
#   verl_omni.trainers — 训练范式（@register_trainer）
#   verl_omni.reward   — reward 管理器（@register reward manager）
#
# algos / features 不走 entry_points（它们的注册表不在 verl_omni 命名空间下），
# 在 __init__.py 里被 import 触发注册。
# ============================================================================
[project.entry-points."verl_omni.models"]
qwen3_5_dense = "verl_omni_ext.models.qwen3_5_dense"
qwen3_5_moe   = "verl_omni_ext.models.qwen3_5_moe"
minicpmo_5_0  = "verl_omni_ext.models.minicpmo_5_0"
qwen3_6_whisper = "verl_omni_ext.models.qwen3_6_whisper"

[project.entry-points."verl_omni.trainers"]
fullduplex = "verl_omni_ext.features.fullduplex"

[project.entry-points."verl_omni.reward"]
audio_quality = "verl_omni_ext.reward"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
include = ["verl_omni_ext*"]